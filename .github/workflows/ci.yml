name: CI

on:
  # Toda PR, venga de este repo o de un fork: es la corrida que el Ruleset mira en una rama de
  # trabajo. Avisa la rotura a quien la escribio antes de compartirla; antes de abrir la PR, eso
  # lo hace el pre-push local (`make check`).
  pull_request:
  # Y cada commit que llega a dev o main, para que la rama integrada tenga su propio verde.
  #
  # NO `push:` en todas las ramas con un `if` que salte el job en la PR para no correr dos veces
  # (#132): un job saltado por un `if` reporta "Success" como check requerido, y la copia saltada
  # de una corrida podia tapar el rojo de la otra sobre el mismo commit. En un commit de dev
  # corren las dos, enteras; ninguna salta.
  push:
    branches: [dev, main]

# Una corrida por rama. Un segundo push cancela el primero en vez de encolarse detras.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    # GitHub Actions solo lee workflows en .github/workflows/ de la RAIZ del repo, pero el
    # proyecto Java (base-conocimiento/) vive en una subcarpeta -- este monorepo tiene tres
    # ejemplos mas del mismo patron (lefthook.yml, .claude/settings.json, .mcp.json), todos en
    # la raiz por la misma razon.
    working-directory: base-conocimiento

jobs:
  check:
    # Sin `if`, a proposito: es un check requerido y no puede tener una copia saltada (#132).
    runs-on: ubuntu-latest

    steps:
      # gitleaks escanea historia, necesita el clone completo.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Deja el binario en PATH para que `make ci` corra el mismo escaneo que el Makefile define.
      # Deliberadamente NO gitleaks/gitleaks-action: esa action corre su propio escaneo en vez de
      # exponer el binario, y pide licencia para repos de organizacion.
      #
      # 8.30.1 resuelto una vez con `gh release view --repo gitleaks/gitleaks` (ver
      # validacion-workshop/f2-preparar-proyecto.md), no se vuelve a resolver en cada corrida.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
        run: |
          set -euo pipefail
          BASE="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          ARCHIVE="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          cd "$(mktemp -d)"
          curl -fsSL -o "$ARCHIVE" "$BASE/$ARCHIVE"
          curl -fsSL -o checksums.txt "$BASE/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " ${ARCHIVE}\$" checksums.txt | sha256sum -c -
          mkdir -p "$HOME/.local/bin"
          tar -xzf "$ARCHIVE" -C "$HOME/.local/bin" gitleaks
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/gitleaks" version

      - name: Install JDK and Maven wrapper cache
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          # 25, no 21: el pom compila a release 25 desde que base-conocimiento se
          # sincronizo con el sandbox. Con 21 el build falla con "release version 25
          # not supported".
          java-version: "25"
          cache: maven
          cache-dependency-path: base-conocimiento/pom.xml

      - name: Run the same gates as local
        run: make ci

      # Sensor de enlaces (#128, #144): un enlace o un ancla de CUALQUIER .md del monorepo que no
      # resuelve falla aca. En #120 aparecieron dos anclas rotas que nadie veia. Mira la raiz del
      # repositorio desde #144, porque hasta entonces no veia REVIEW.md ni la plantilla de PR, que
      # es justo donde estaba el enlace roto de #121. Corre en la raiz, no en base-conocimiento/.
      - name: Docs links resolve
        working-directory: .
        run: node scripts/verificar-enlaces.mjs

      # Sensor de ancho de linea (#165): una linea de prosa sobre 100 caracteres en un .md o un
      # .mjs de los que este metodo mantiene falla aca. La convencion existia y la respetaba quien
      # se acordaba: en la ronda de #162 se rompio cuatro veces, y la cuarta la cazo la revision de
      # codigo con el PR ya abierto. Corre en la raiz, no en base-conocimiento/.
      - name: Line width is respected
        working-directory: .
        run: node scripts/verificar-ancho.mjs

      # Sensor del pie de asistencia (#192): todo commit declara `Asistido-por-IA: <modelo>` o
      # `Sin-IA:`, que es de donde sale el porcentaje de PRs asistidas de impact-metrics. Corre
      # tambien como hook commit-msg; este paso existe porque el hook local lo salta `LEFTHOOK=0`
      # sin dejar rastro, y un dato que sostiene una metrica no puede depender de eso.
      #
      # En una PR el rango son sus commits (base..HEAD, con fetch-depth 0 mas arriba); en un push a
      # dev o main, el commit que llego. Los merges quedan fuera: no los escribe una persona.
      - name: Every commit declares whether AI assisted it
        working-directory: .
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [ -n "${BASE_SHA:-}" ]; then RANGO="$BASE_SHA..HEAD"; else RANGO="HEAD~1..HEAD"; fi
          node scripts/verificar-pie-ia.mjs --rango "$RANGO"

      # Sensor de citas a pasos de skill (#193): el visor explica lo que una skill hace por dentro
      # citando sus pasos («el paso G de la skill», «su Fase 5»), y una cita que la skill ya no
      # tiene falla aca. Las letras viven en references/, no en el SKILL.md. Corre en la raiz.
      - name: Viewer step citations match the skills
        working-directory: .
        run: node scripts/verificar-pasos-skill.mjs

      # Sensor visor <-> playbook (#203): cada codigo y cada titulo que el playbook cita del visor
      # tiene que seguir existiendo, y las skills nombradas tienen que ser las mismas de los dos
      # lados. Era la unica de las tres relaciones de la regla dura sin sensor. Corre en la raiz.
      - name: The playbook still describes the viewer it cites
        working-directory: .
        run: node scripts/verificar-visor-playbook.mjs

      # Sensor del playbook (#117): una caja que cambia de badge sin que cambien su dato B(), su
      # seccion y los contadores falla aca. Node ya viene en el runner; el script no tiene
      # dependencias. Corre en la raiz, no en base-conocimiento/.
      - name: Playbook coverage is consistent
        working-directory: .
        run: node playbook-sdlc-ia/verificar-cobertura.mjs

      # Sensor del espejo con el sandbox (#155): una diferencia entre base-conocimiento/ y la raiz
      # de G3A/base-conocimiento-sandbox que el ADR-0003 no explique falla aca. Hasta este issue la
      # lista de divergencias se mantenia a mano y el propio ADR lo admitia. Corre en la raiz.
      #
      # El bloque `env:` NO es opcional, a diferencia de los dos sensores de arriba: este sale a la
      # red, y en Actions secrets.GITHUB_TOKEN no esta en el entorno por si solo. Sin cablearlo el
      # fetch sale anonimo -- 60 peticiones/hora por IP, desde IPs compartidas de runners --, o sea
      # rojos intermitentes sin relacion con el repo. El sandbox es publico: el token es por cuota,
      # no por permiso.
      - name: Mirror with the sandbox is explained
        working-directory: .
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # En una PR el checkout deja HEAD sobre un merge commit efimero, asi que el sensor
          # reportaria "en HEAD (<sha que nadie puede traer>)". El ADR promete que ese reporte
          # sirve para reproducir un rojo: la rama y la punta real llegan desde aca.
          ESPEJO_REF: ${{ github.head_ref || github.ref_name }}
          ESPEJO_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/verificar-espejo.mjs

      - name: Publish test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: "base-conocimiento/**/target/surefire-reports/**"
          if-no-files-found: ignore

# La proteccion de rama es lo que convierte esto de un reporte en un gate:
# Settings > Branches > exigir el status check `check` antes de mergear.
