name: CI

on:
  # Cada push, cada rama. Un gate que solo corre en main avisa la rotura despues de compartida;
  # en una rama de feature avisa a quien la escribio, mientras todavia tiene el contexto.
  push:
  # Suma PRs abiertas desde forks, cuyos commits nunca disparan el push de arriba.
  pull_request:

# Una corrida por rama. Un segundo push cancela el primero en vez de encolarse detras.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    # GitHub Actions solo lee workflows en .github/workflows/ de la RAIZ del repo, pero el
    # proyecto Java (base-conocimiento/) vive en una subcarpeta -- este monorepo tiene tres
    # ejemplos mas del mismo patron (lefthook.yml, .claude/settings.json, .mcp.json), todos en
    # la raiz por la misma razon.
    working-directory: base-conocimiento

jobs:
  check:
    # Sin esto, cada PR dentro de este mismo repo corre dos veces: una por el push a su rama y
    # otra por el evento pull_request. Los PR de forks igual corren -- su push nunca llego aca.
    if: >-
      github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest

    steps:
      # gitleaks escanea historia, necesita el clone completo.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Deja el binario en PATH para que `make ci` corra el mismo escaneo que el Makefile define.
      # Deliberadamente NO gitleaks/gitleaks-action: esa action corre su propio escaneo en vez de
      # exponer el binario, y pide licencia para repos de organizacion.
      #
      # 8.30.1 resuelto una vez con `gh release view --repo gitleaks/gitleaks` (ver
      # validacion-workshop/f2-preparar-proyecto.md), no se vuelve a resolver en cada corrida.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
        run: |
          set -euo pipefail
          BASE="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          ARCHIVE="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          cd "$(mktemp -d)"
          curl -fsSL -o "$ARCHIVE" "$BASE/$ARCHIVE"
          curl -fsSL -o checksums.txt "$BASE/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " ${ARCHIVE}\$" checksums.txt | sha256sum -c -
          mkdir -p "$HOME/.local/bin"
          tar -xzf "$ARCHIVE" -C "$HOME/.local/bin" gitleaks
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/gitleaks" version

      - name: Install JDK and Maven wrapper cache
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          # 25, no 21: el pom compila a release 25 desde que base-conocimiento se
          # sincronizo con el sandbox. Con 21 el build falla con "release version 25
          # not supported".
          java-version: "25"
          cache: maven
          cache-dependency-path: base-conocimiento/pom.xml

      - name: Run the same gates as local
        run: make ci

      # Sensor del playbook (#117): una caja que cambia de badge sin que cambien su dato B(), su
      # seccion y los contadores falla aca. Node ya viene en el runner; el script no tiene
      # dependencias. Corre en la raiz, no en base-conocimiento/.
      - name: Playbook coverage is consistent
        working-directory: .
        run: node playbook-sdlc-ia/verificar-cobertura.mjs

      - name: Publish test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: "base-conocimiento/**/target/surefire-reports/**"
          if-no-files-found: ignore

  changelog-liberado:
    # Solo en PRs hacia main (#125). En dev, entre una liberacion y otra, [unreleased] es el estado
    # normal: como paso de `check` fallaria en cada push. Hacia main significa lo contrario --
    # que falta la PR chore/release-<version> a dev, y main recibiria el codigo nuevo con la
    # version vieja en plugin.json (paso con #122, se reparo con #123 y #124).
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: El CHANGELOG no empieza con [unreleased]
        working-directory: .
        run: |
          set -euo pipefail
          CHANGELOG="${CHANGELOG:-instrumentacion-java-ia/CHANGELOG.md}"
          # La primera entrada de version es lo que se esta por liberar.
          PRIMERA="$(grep -m1 '^## \[' "$CHANGELOG" || true)"
          echo "Primera entrada de ${CHANGELOG}: ${PRIMERA:-(ninguna)}"
          if [ -z "$PRIMERA" ]; then
            echo "::error file=${CHANGELOG}::El CHANGELOG no tiene ninguna entrada de version."
            exit 1
          fi
          if printf '%s\n' "$PRIMERA" | grep -qi '^## \[unreleased\]'; then
            echo "::error file=${CHANGELOG}::El CHANGELOG todavia empieza con [unreleased]. Falta la PR chore/release-<version> a dev, que sube plugin.json y fecha esta entrada, antes de liberar a main (ADR 0001)."
            exit 1
          fi
          echo "OK: ${PRIMERA#'## '} es la version que llega a main."

# La proteccion de rama es lo que convierte esto de un reporte en un gate:
# Settings > Branches > exigir el status check `check` antes de mergear.
