# lefthook busca su config en la raiz del repositorio git (este monorepo), no en la carpeta de
# cada proyecto -- por eso este archivo vive aca y no en base-conocimiento/, y cada comando usa
# `root:` para acotarse a esa subcarpeta (glob + root filtran: un commit que no toque
# base-conocimiento/ no dispara nada de esto). Ver validacion-workshop/f2-preparar-proyecto.md
# para el detalle de este hallazgo.

pre-commit:
  parallel: true
  # Merges y rebases repiten commits que ya pasaron estos checks; un conflicto en curso es un
  # mal momento para que un formateador bloquee.
  skip:
    - merge
    - rebase
  commands:
    base-conocimiento-format:
      root: "base-conocimiento/"
      glob: "*.java"
      run: sh ./mvnw -q spotless:check
      fail_text: "Style: run `make -C base-conocimiento format` and re-stage."

pre-push:
  commands:
    # Los dos sensores de aca van sin `root:`: cubren todo el monorepo y sus rutas son relativas a
    # la raiz del repositorio. Los dos son locales y de un segundo, por eso corren tambien en el
    # pre-push; el del espejo no, porque sale a la red y un hook que sale a la red bloquea el push
    # cuando falla el wifi.
    #
    # Las `priority` no son adorno y el orden de declaracion NO alcanza: lefthook ordena los
    # comandos secuenciales ALFABETICAMENTE. Da la casualidad de que "ancho" y "base-conocimiento-
    # check" ya quedarian en ese orden, pero "enlaces" no: sin su priority correria DESPUES del
    # `make check`, que tarda mas de dos minutos, y no tiene sentido esperarlo para enterarte de un
    # enlace roto que se ve en un segundo. Un comando sin `priority` corre al final.
    # https://lefthook.dev/configuration/priority/
    #
    # Hasta #144 el de enlaces solo corria en CI, o sea que la rotura se descubria despues del
    # push. Los dos necesitan node >= 18 en el PATH, que antes solo hacia falta en el runner.
    ancho:
      priority: 1
      run: node scripts/verificar-ancho.mjs
      fail_text: "A prose line is over 100 chars. See scripts/verificar-ancho.mjs."
    enlaces:
      priority: 2
      run: node scripts/verificar-enlaces.mjs
      fail_text: "Broken doc links (or node missing from PATH). See scripts/verificar-enlaces.mjs."
    pasos-skill:
      priority: 3
      run: node scripts/verificar-pasos-skill.mjs
      fail_text: "The viewer cites a skill step that no longer exists. See scripts/verificar-pasos-skill.mjs."
    base-conocimiento-check:
      root: "base-conocimiento/"
      run: make check
      fail_text: "`make check` failed in base-conocimiento/. Fix it before pushing."

# Escape hatch de emergencia: LEFTHOOK=0 git commit ...
# Existe a proposito -- un gate sin salida termina desinstalado, no saltado.
