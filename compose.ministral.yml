# Perfil de modelo: Ministral 3 3B Instruct-2512 (Mistral AI), via la imagen oficial
# ghcr.io/ggml-org/llama.cpp:server-cuda -- sin fork, ver sesion 10 de
# docs/investigacion-vram-y-modelo-llm.md.
#
# Hermano de compose.bonsai.yml: mismo patron (agrega un servicio llama-server y
# apunta `api` a el), pero con SUS PROPIOS valores. No comparten .env ni el mismo
# bloque de environment -- eso fue justamente el problema que la sesion 14 destapo
# sin querer: al probar Ministral se reuso compose.bonsai.yml con solo el base-url
# cambiado, asi que el piloto de 100 preguntas de Ministral corrio con
# KB_UMBRAL_RELEVANCIA_TECHO_CONFIANZA=6.0 (tuneado a mano PARA Bonsai, sesion 9) en
# vez de un valor calibrado para Ministral. Este archivo existe para que la proxima
# vez que se pruebe o compare un modelo nuevo, no haga falta pisar ni adivinar los
# ajustes de otro ya tuneado -- cada modelo tiene su propio archivo, su propio
# puerto, y sus propios valores.
#
# Uso, junto con el perfil GPU real:
#   docker compose -f compose.yml -f compose.gpu.yml -f compose.ministral.yml up -d
#
# A diferencia de Bonsai, no hace falta compilar nada ni montar un GGUF del host:
# la imagen oficial ya soporta este modelo, y el flag -hf de llama-server resuelve
# el repo de Hugging Face solo (se cachea en el volumen de abajo, ~2 GB la primera
# vez).

services:
  llama-server-ministral:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    container_name: kb-llama-server-ministral
    command:
      - "-hf"
      - "mistralai/Ministral-3-3B-Instruct-2512-GGUF:Q4_K_M"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8080"
      # Se queda en 4096 a proposito, sin subirlo como se hizo con BONSAI_CTX_SIZE
      # en compose.bonsai.yml (sesion 15). Medido en vivo con nvidia-smi (mismo
      # protocolo: produccion detenida un momento para una linea base limpia):
      # Ministral en 4096 usa 2595 MiB; duplicar a 8192 sube a 3015 MiB (+420 MiB) y
      # deja solo 924 MiB libres de los ~3.9 GB reales de esta T600 -- un margen
      # mucho mas ajustado que el de Bonsai (1.6 GB libres al mismo ctx-size, por
      # partir de un modelo que pesa una fraccion de esto). Tecnicamente entra sin
      # OOM, pero sin margen para otro consumidor de GPU concurrente (el propio
      # escritorio de Windows, hallazgo 1). Subir esto a 8192 es una decision de
      # producto, no un ajuste barato como en Bonsai -- dejar en 4096 hasta que haga
      # falta de verdad, o probar un punto intermedio (6144) antes de comprometerse.
      - "--ctx-size"
      - "${MINISTRAL_CTX_SIZE:-4096}"
      # --parallel 1 --no-mmproj: sin esto, llama-server autodetecta 4 slots de
      # generacion concurrente (cada uno con su propia cache KV) y carga el
      # componente de vision del modelo (mmproj, no lo usa este pipeline de solo
      # texto) -- medido en vivo (sesion 10): 3463 MiB usados con los defaults,
      # solo 476 MiB libres de los 4096 MiB de la T600, contra 2603 MiB/1336 MiB
      # libres con estos dos flags. El caso real de uso es una sola consulta a la
      # vez, texto puro.
      - "--parallel"
      - "1"
      - "--no-mmproj"
      - "--n-gpu-layers"
      - "99"
    volumes:
      # Cache de Hugging Face, separado del de Bonsai (que monta el GGUF directo
      # sin cache -hf). Sin este volumen persistente, un contenedor efimero pierde
      # los ~2 GB descargados al eliminarse -- paso en las sesiones 10 y 14, hubo
      # que volver a bajarlo para esta investigacion.
      - ${KB_DATA_DIR:-./.data}/ministral-cache:/root/.cache/llama.cpp
    ports:
      # 8083, no 8081 (ese es Bonsai, compose.bonsai.yml) ni 8082 (el puerto ad-hoc
      # que usaron las sesiones 10/14 para pruebas aisladas fuera de compose):
      # los dos perfiles pueden convivir arriba a la vez si hace falta comparar.
      - "${MINISTRAL_PORT:-8083}:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 60s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped

  api:
    depends_on:
      llama-server-ministral:
        condition: service_healthy
    environment:
      SPRING_AI_OPENAI_BASE_URL: http://llama-server-ministral:8080
      KB_LLM_MODELO: mistralai/Ministral-3-3B-Instruct-2512-GGUF:Q4_K_M
      # Ministral genera mas rapido que Bonsai (9.2 tok/s vs 5.8-6.9, sesion 10)
      # pero el prefill es igual de lento que la generacion (hallazgo 33) -- con
      # contextos largos (jls25.pdf domina el corpus) el total no es tan distinto.
      # 450s (igual que Bonsai) hasta tener una medicion propia que diga lo
      # contrario -- no asumir que "mas rapido generando" es "mas rapido en total".
      KB_LLM_TIMEOUT: ${KB_LLM_TIMEOUT:-450s}
      # Punto de partida: el default de ADR-0008 (calibrado con gemma3:4b, corpus
      # de referencia chico), NO el 6.0 que la sesion 9 tuneo para Bonsai -- ese
      # numero no tiene evidencia propia con Ministral. La sesion 15 (ver
      # docs/investigacion-vram-y-modelo-llm.md) reviso las 17 preguntas AMBIGUO
      # que el piloto de la sesion 14 rechazo de mas: bajar el techo a ~3.0
      # recupera con seguridad SOLO 1 de esas 17 (ninguna pregunta de control
      # cruza 2.63, y la siguiente que si respondia bien llegaba a rerank=5.05) --
      # las otras dos que parecian candidatas por su rerank alto (4.34, 4.35) son
      # en realidad las mismas que desbordan el contexto (ver mas abajo): saltarse
      # la verificacion no las arregla, solo cambia un rechazo prolijo por un
      # crash de sintesis sin manejar. No asumir que "score alto" = "candidata
      # segura" sin cruzarlo primero contra el limite de contexto.
      KB_UMBRAL_RELEVANCIA_TECHO_CONFIANZA: ${KB_UMBRAL_RELEVANCIA_TECHO_CONFIANZA:-8.0}
      # Estos tres SI se copian del perfil Bonsai, a proposito y por una razon
      # distinta a la de arriba: no son un ajuste de calidad/confianza de un
      # modelo puntual, son consecuencia directa de compartir el mismo limite
      # fisico -- Ministral corre con el mismo ctx-size=4096 que Bonsai (arriba),
      # y el corpus (jls25.pdf, ~900 paginas) es el mismo para cualquier modelo
      # que se pruebe. Sin este recorte, la sesion 14 midio 3 de 100 preguntas de
      # Ministral cayendo con "exceeds the available context size" -- y eso corrio
      # CON este recorte ya activo (heredado sin querer del perfil Bonsai), asi
      # que quitarlo aca arriesgaria mas fallas de este tipo, no menos.
      #
      # Aun con este recorte activo, la sesion 15 midio que 6 de las 17 preguntas
      # AMBIGUO que el piloto rechazo de mas (35%) YA exceden los 4096 tokens en
      # la llamada a VerificadorGrounding con el sistema+contexto real -- y ese
      # desborde HTTP 400 lo atrapa el catch de VerificadorGroundingOpenAi.java
      # en silencio, indistinguible en el reporte de un rechazo legitimo. Es la
      # causa individual mas grande de las 17 fallas -- mas grande que cualquier
      # diferencia de juicio entre Ministral y Bonsai como verificador (que solo
      # movio el resultado en 1 de 9 casos comparables, ver sesion 15). Bajar
      # esta cuenta aun mas (5, o repartir el presupuesto de forma distinta entre
      # sintesis y verificacion) es la via de mayor impacto pendiente, no
      # explorada todavia en ninguna sesion.
      KB_EXPANDIR_VECINOS: ${KB_EXPANDIR_VECINOS:-false}
      KB_MAX_FRAGMENTOS_CONTEXTO: ${KB_MAX_FRAGMENTOS_CONTEXTO:-6}
      KB_RECUPERACION_TOP_RERANK: ${KB_RECUPERACION_TOP_RERANK:-6}
