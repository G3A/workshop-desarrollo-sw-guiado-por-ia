# Perfil experimental: Granite 4.1 3B (IBM), servido por el mismo `ollama` que
# ya levanta compose.yml -- mismo mecanismo que los otros perfiles de Ollama.
#
# Por que este perfil se crea ahora: `granite4.1:3b` se probo en las sesiones
# 2-4 y 15 de docs/investigacion-vram-y-modelo-llm.md con overrides sueltos
# (-e KB_LLM_MODELO=... contra un kb-api-test temporal), sin un compose.*.yml
# dedicado -- ese patron se adopto recien desde compose.ministral.yml (sesion
# 15) en adelante. Se crea este archivo para la sesion 25 (piloto de 100
# preguntas con sintesis estructurada), siguiendo el mismo patron que
# compose.nemotron.yml.
#
# Descartado como Sintetizador de texto libre en las sesiones 2-4 (hallazgo 3):
# pega el fragmento crudo linea por linea en vez de redactar prosa. Este
# perfil existe para volver a probarlo con KB_LLM_SINTESIS_ESTRUCTURADA_HABILITADA=true
# (ver SintetizadorEstructuradoOpenAi.java, sesion 24) y ver si ese defecto se
# resuelve a escala del piloto completo.
#
# Uso, junto con el perfil GPU real:
#   docker compose -f compose.yml -f compose.gpu.yml -f compose.granite41.yml up -d
#
# El modelo NO se baja solo: hace falta `make pull-granite41` (o
# `docker compose exec ollama ollama pull granite4.1:3b`) antes de levantar
# `api`, una sola vez.

services:
  api:
    environment:
      SPRING_AI_OPENAI_BASE_URL: http://ollama:11434/v1
      KB_LLM_MODELO: granite4.1:3b
      KB_LLM_TIMEOUT: ${KB_LLM_TIMEOUT:-450s}
      KB_UMBRAL_RELEVANCIA_TECHO_CONFIANZA: ${KB_UMBRAL_RELEVANCIA_TECHO_CONFIANZA:-8.0}
      KB_EXPANDIR_VECINOS: ${KB_EXPANDIR_VECINOS:-false}
      KB_MAX_FRAGMENTOS_CONTEXTO: ${KB_MAX_FRAGMENTOS_CONTEXTO:-6}
      KB_RECUPERACION_TOP_RERANK: ${KB_RECUPERACION_TOP_RERANK:-6}
      KB_RECUPERACION_TOPE_POR_DOCUMENTO: ${KB_RECUPERACION_TOPE_POR_DOCUMENTO:-20}
      KB_LLM_SINTESIS_ESTRUCTURADA_HABILITADA: ${KB_LLM_SINTESIS_ESTRUCTURADA_HABILITADA:-false}
