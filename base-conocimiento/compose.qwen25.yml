# Perfil experimental: Qwen2.5 3B (Alibaba), servido por el mismo `ollama` que
# ya levanta compose.yml -- mismo mecanismo que los otros perfiles de Ollama.
# Ver compose.granite41.yml sobre por que este archivo se crea recien ahora
# para un modelo probado desde la sesion 4.
#
# Descartado como Sintetizador de texto libre en la sesion 4 (hallazgo 9):
# entra 100% en GPU (el mejor ajuste de VRAM de los "clasicos" de esta
# investigacion) pero pega los fragmentos casi textuales con una sola cita
# suelta al principio, y ademas reproduce la alucinacion de control del
# ADR-0008. Este perfil existe para volver a probarlo con
# KB_LLM_SINTESIS_ESTRUCTURADA_HABILITADA=true (sesion 24/25).
#
# Licencia: Qwen RESEARCH LICENSE (no Apache 2.0, a diferencia de otros
# tamaños de Qwen2.5) -- ver hallazgo 9, sin relevancia para uso interno de
# evaluacion pero a tener en cuenta si se considerara para produccion.
#
# Uso, junto con el perfil GPU real:
#   docker compose -f compose.yml -f compose.gpu.yml -f compose.qwen25.yml up -d
#
# El modelo NO se baja solo: hace falta `make pull-qwen25` (o
# `docker compose exec ollama ollama pull qwen2.5:3b`) antes de levantar
# `api`, una sola vez.

services:
  api:
    environment:
      SPRING_AI_OPENAI_BASE_URL: http://ollama:11434/v1
      KB_LLM_MODELO: qwen2.5:3b
      KB_LLM_TIMEOUT: ${KB_LLM_TIMEOUT:-450s}
      KB_UMBRAL_RELEVANCIA_TECHO_CONFIANZA: ${KB_UMBRAL_RELEVANCIA_TECHO_CONFIANZA:-8.0}
      KB_EXPANDIR_VECINOS: ${KB_EXPANDIR_VECINOS:-false}
      KB_MAX_FRAGMENTOS_CONTEXTO: ${KB_MAX_FRAGMENTOS_CONTEXTO:-6}
      KB_RECUPERACION_TOP_RERANK: ${KB_RECUPERACION_TOP_RERANK:-6}
      KB_RECUPERACION_TOPE_POR_DOCUMENTO: ${KB_RECUPERACION_TOPE_POR_DOCUMENTO:-20}
      KB_LLM_SINTESIS_ESTRUCTURADA_HABILITADA: ${KB_LLM_SINTESIS_ESTRUCTURADA_HABILITADA:-false}
