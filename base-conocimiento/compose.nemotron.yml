# Perfil experimental: Nemotron-mini 4B (NVIDIA), servido por el mismo `ollama`
# que ya levanta compose.yml -- mismo mecanismo que compose.ministral.yml y
# compose.qwen35.yml (sin llama-server aparte).
#
# Por que este candidato: la sesion 22 de docs/investigacion-vram-y-modelo-llm.md
# lo agrega como alternativa a Ministral -- `ollama show nemotron-mini:4b`
# declara SOLO "completion" y "tools", SIN "thinking" -- a diferencia de
# qwen3.5:4b (compose.qwen35.yml), este candidato no tiene el riesgo
# estructural que ya descarto a la mitad de los candidatos de esta
# investigacion (el pensamiento nativo comiendose el maxTokens de las salidas
# JSON forzadas de Planificador/VerificadorGrounding/Reformulador). Contexto
# 4096 confirmado directo por `ollama show` (no una suposicion como con
# qwen3.5:4b) -- coincide con el recorte que ya usa este pipeline para el
# corpus de jls25.pdf.
#
# Uso, junto con el perfil GPU real:
#   docker compose -f compose.yml -f compose.gpu.yml -f compose.nemotron.yml up -d
#
# El modelo NO se baja solo: hace falta `make pull-nemotron` (o
# `docker compose exec ollama ollama pull nemotron-mini:4b`) antes de levantar
# `api`, una sola vez. Mismo volumen de Ollama que el resto de los perfiles.
#
# ADVERTENCIA -- igual que compose.qwen35.yml: sin "thinking" reduce el riesgo
# estructural mas grande medido en esta investigacion, pero NO reemplaza el
# piloto de evaluacion (eval-100-preguntas/) que le dio a Ministral su cifra
# de 85.3% de precision. Confirmar con el piloto antes de considerarlo listo
# para produccion.

services:
  api:
    environment:
      SPRING_AI_OPENAI_BASE_URL: http://ollama:11434/v1
      KB_LLM_MODELO: nemotron-mini:4b
      KB_LLM_TIMEOUT: ${KB_LLM_TIMEOUT:-450s}
      # Punto de partida: el default de ADR-0008 (calibrado con gemma3:4b), NO
      # un valor propio de nemotron-mini -- mismo caveat que los otros perfiles.
      KB_UMBRAL_RELEVANCIA_TECHO_CONFIANZA: ${KB_UMBRAL_RELEVANCIA_TECHO_CONFIANZA:-8.0}
      # A diferencia de qwen3.5:4b, el ctx-size de 4096 SI esta confirmado
      # directo por `ollama show nemotron-mini:4b` (campo "context length"),
      # no es una suposicion heredada de Ministral -- pero el recorte en si
      # (por que 6/6, no 10/10) sigue siendo el mismo problema fisico del
      # corpus dominado por jls25.pdf que ya documento compose.ministral.yml.
      KB_EXPANDIR_VECINOS: ${KB_EXPANDIR_VECINOS:-false}
      KB_MAX_FRAGMENTOS_CONTEXTO: ${KB_MAX_FRAGMENTOS_CONTEXTO:-6}
      KB_RECUPERACION_TOP_RERANK: ${KB_RECUPERACION_TOP_RERANK:-6}
      KB_RECUPERACION_TOPE_POR_DOCUMENTO: ${KB_RECUPERACION_TOPE_POR_DOCUMENTO:-20}
      # false por defecto -- overrideable por shell para la sesion 25
      # (docs/investigacion-vram-y-modelo-llm.md): probar
      # SintetizadorEstructuradoOpenAi contra el defecto de "texto pegado sin
      # citas" que el hallazgo 85 midio en este mismo modelo.
      KB_LLM_SINTESIS_ESTRUCTURADA_HABILITADA: ${KB_LLM_SINTESIS_ESTRUCTURADA_HABILITADA:-false}
