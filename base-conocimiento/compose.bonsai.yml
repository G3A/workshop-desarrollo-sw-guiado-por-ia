# Prototipo experimental de ADR-0009 (docs/adrs/0009-bonsai-8b-integracion-pospuesta.md,
# puntos 1 y 3 de la lista de trabajo de arquitectura). Servicio ADICIONAL, no
# reemplaza a `ollama` -- bge-m3 se queda ahi (punto 2 del ADR, sin resolver).
#
# Uso, junto con el perfil GPU real:
#   docker compose -f compose.yml -f compose.gpu.yml -f compose.bonsai.yml up -d --build
#
# OJO -- a diferencia de cuando este archivo solo levantaba `llama-server`
# solo, ahora SI hace falta para tener chat funcionando: `kb-api` (ver el
# override de `api` mas abajo) ya usa `OpenAiChatModel` apuntando a este
# servicio (punto 3 del ADR, sesion 6 de la investigacion) para el
# planificador, el verificador de grounding y el sintetizador. Sin este
# archivo, esos tres componentes no tienen a quien hablarle -- el perfil
# base (`compose.yml` solo) ya no alcanza para una consulta completa
# mientras este prototipo siga en esta rama.
#
# El GGUF (~1.16 GB) no viene en la imagen: se monta desde el host. Bajalo a
# mano a ${KB_DATA_DIR:-./.data}/bonsai/Bonsai-8B-Q1_0.gguf, por ejemplo:
#   mkdir -p .data/bonsai && curl -fL --progress-bar \
#     -o .data/bonsai/Bonsai-8B-Q1_0.gguf \
#     https://huggingface.co/prism-ml/Bonsai-8B-gguf/resolve/main/Bonsai-8B-Q1_0.gguf

services:
  llama-server:
    build:
      context: .
      dockerfile: Dockerfile.bonsai
      args:
        # 75 = Turing (T600). Cambiar si tu GPU es otra generacion:
        #   75 = Turing (T600, RTX 20xx)   86 = Ampere (RTX 30xx)
        #   89 = Ada (RTX 40xx)            120 = Blackwell (RTX 50xx)
        CUDA_ARCH: ${BONSAI_CUDA_ARCH:-75}
        # La imagen base de CUDA verifica el driver del host al arrancar: 12.6.0
        # exige >= 560. Bajarlo (12.4.1 pide >= 550) es la salida si no se puede
        # actualizar el driver -- ver el comentario en Dockerfile.bonsai.
        CUDA_TAG: ${BONSAI_CUDA_TAG:-12.6.0}
    container_name: kb-llama-server
    environment:
      # 4096 se quedaba corto: la sesion 15 (docs/investigacion-vram-y-modelo-llm.md,
      # hallazgo 51) midio que 6 de 17 preguntas del piloto de Ministral desbordaban
      # ese limite en la llamada a VerificadorGrounding, y la sesion 14 ya habia visto
      # el mismo desborde romper la sintesis en 3 preguntas mas -- mismo limite fisico,
      # afecta a cualquier modelo que sirva este llama-server. Medido en vivo con
      # nvidia-smi (contenedor de prueba aislado, produccion detenida un momento para
      # una linea base limpia): duplicar a 8192 solo cuesta ~568 MiB extra (1765->2333
      # MiB), dejando 1.6 GB libres de sobra en la T600 de 4 GB -- cubre con margen el
      # peor caso medido (~5000 tokens). Barato y seguro para Bonsai especificamente
      # (pesa poco, sobra VRAM); no asumir que el mismo margen aplica a otro modelo sin
      # medirlo aparte (Ministral, por ejemplo, parte de mucha menos VRAM libre).
      BONSAI_CTX_SIZE: ${BONSAI_CTX_SIZE:-8192}
      BONSAI_GPU_LAYERS: ${BONSAI_GPU_LAYERS:-99}
    volumes:
      - ${KB_DATA_DIR:-./.data}/bonsai:/models/bonsai:ro
    ports:
      # 8081, no 8080: ese puerto ya lo usa kb-api en el host.
      - "${BONSAI_PORT:-8081}:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 60s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped

  # Aparte de sumar `llama-server`, este override apunta `kb-api` a el en vez
  # de al `gemma3:4b` de Ollama -- ver el comentario de arriba sobre por que
  # esto ya no es opcional para tener chat funcionando en esta rama.
  api:
    depends_on:
      llama-server:
        condition: service_healthy
    environment:
      SPRING_AI_OPENAI_BASE_URL: http://llama-server:8080
      KB_LLM_MODELO: ${KB_LLM_MODELO:-Bonsai-8B-Q1_0.gguf}
      # BONSAI_CTX_SIZE de arriba ERA 4096 (sesion 8). El default de kb.orquestacion.max-
      # fragmentos-contexto/kb.recuperacion.top-rerank (10 cada uno) arma un
      # prompt de sintesis de ~5070 tokens con los fragmentos de jls25.pdf del
      # corpus de ejemplo -- supera el contexto y la sintesis falla con 400
      # "exceeds the available context size" (medido en vivo). En esa sesion se
      # asumio que subir BONSAI_CTX_SIZE arriesgaba un OOM con solo ~1.6 GB libres --
      # la sesion 15 midio lo contrario en vivo (nvidia-smi, produccion detenida un
      # momento para una linea base limpia): duplicar a 8192 solo cuesta ~568 MiB,
      # sin riesgo real de OOM en esta GPU. BONSAI_CTX_SIZE ya subio a 8192 arriba
      # como consecuencia -- bajar la cantidad de fragmentos (lo de abajo) sigue
      # siendo valido igual, pero ya no es la UNICA opcion sin riesgo que parecia.
      #
      # OJO: bajar solo top-rerank (10 -> 6) casi no movio el total medido
      # (5070 -> 5068 tokens): Orquestador.construirContexto() expande CADA
      # fragmento con sus 2 chunks vecinos (ord-1/ord+1, ver
      # ContextoRepositorio.vecinos), y las secciones de jls25.pdf son largas
      # -- el tamaño lo domina la expansion de vecinos, no la cantidad de
      # fragmentos. Bajar max-fragmentos-contexto a 2 arreglaba el limite de
      # contexto, pero a un costo real medido en vivo: preguntas relacionadas
      # (p. ej. "wrapper classes", "novedades de Java 25") fallaban con el
      # mensaje generico aunque el chunk correcto SI estuviera ingerido --
      # solo entraban los 2 candidatos mejor rankeados, y el relevante no
      # siempre es top-2. KB_EXPANDIR_VECINOS=false apaga esa expansion (hasta
      # 3x menos tokens por fragmento sin vecinos), lo que permite volver a
      # subir max-fragmentos-contexto sin superar el limite de contexto.
      KB_EXPANDIR_VECINOS: ${KB_EXPANDIR_VECINOS:-false}
      KB_MAX_FRAGMENTOS_CONTEXTO: ${KB_MAX_FRAGMENTOS_CONTEXTO:-6}
      KB_RECUPERACION_TOP_RERANK: ${KB_RECUPERACION_TOP_RERANK:-6}
      # 180s (el default de application.yml) no alcanza aca: una pregunta que
      # dispara planificador + 2 herramientas + verificador de grounding +
      # sintesis son varias llamadas secuenciales a Bonsai, que a ~1-3.5
      # tok/s en esta GPU puede superar los 180s en total -- medido en vivo
      # (java.io.InterruptedIOException: timeout, cliente OpenAI). 300s no
      # alcanzo tampoco: el piloto de evaluacion de la sesion 9 (100 preguntas
      # sobre jls25.pdf, ver docs/investigacion-vram-y-modelo-llm.md) midio en
      # vivo que VerificadorGrounding, al ser la ULTIMA llamada secuencial de
      # una consulta ya larga, se quedaba sin margen y se caia por timeout --
      # rechazando por precaucion contenido que SI era relevante (un caso
      # midio rerank=7.9, casi el maximo, y aun asi se rechazo). 450s da mas
      # colchon para ese ultimo tramo.
      KB_LLM_TIMEOUT: ${KB_LLM_TIMEOUT:-450s}
      # ADR-0008 fijo 8.0 contra gemma3:4b con un corpus de referencia chico.
      # El piloto de la sesion 9 midio que, con el corpus real (jls25.pdf,
      # 1060 chunks) y Bonsai como verificador, un match casi perfecto
      # (rerank=7.9) igual caia en la zona AMBIGUO (por debajo de 8.0) y
      # depender de VerificadorGrounding ahi es fragil -- ver el ajuste de
      # timeout arriba. Bajarlo a 6.0 deja que los matches mas fuertes salten
      # directo a SUFICIENTE sin pasar por esa verificacion menos confiable.
      KB_UMBRAL_RELEVANCIA_TECHO_CONFIANZA: ${KB_UMBRAL_RELEVANCIA_TECHO_CONFIANZA:-6.0}
      # No es un ajuste de Bonsai -- es un bug de composicion del corpus que el
      # piloto de la sesion 9 destapo por primera vez porque es el primer corpus
      # de este proyecto dominado casi por completo por UN solo documento
      # (jls25.pdf, 1060 de 1065 chunks). kb.recuperacion.tope-por-documento
      # (default 3) esta pensado para dar diversidad entre VARIOS documentos --
      # aca, con 3 chunks de jls25.pdf sobreviviendo la fusion RRF antes de
      # llegar al reranker, la enorme mayoria del propio JLS queda descartada
      # de entrada sin que el cross-encoder llegue a verla. Medido en vivo: la
      # definicion real de "record" (JLS SS8.10, chunk 481) nunca aparecio entre
      # los candidatos finales para "que es un record en Java" -- no por mal
      # juicio de VerificadorGrounding, sino porque nunca llego a competir.
      # Subir el tope a 15 (y max-candidatos a 30 para darle mas margen al
      # reranker) no toca KB_RECUPERACION_TOP_RERANK/max-fragmentos-contexto
      # (siguen en 6): el presupuesto de contexto de Bonsai no cambia, solo
      # compiten mas candidatos reales antes de esa etapa final.
      KB_RECUPERACION_TOPE_POR_DOCUMENTO: ${KB_RECUPERACION_TOPE_POR_DOCUMENTO:-15}
      KB_RECUPERACION_MAX_CANDIDATOS: ${KB_RECUPERACION_MAX_CANDIDATOS:-30}
      KB_LLM_SINTESIS_ESTRUCTURADA_HABILITADA: ${KB_LLM_SINTESIS_ESTRUCTURADA_HABILITADA:-false}
