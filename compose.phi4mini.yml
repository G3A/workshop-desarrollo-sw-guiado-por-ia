# Perfil experimental: Phi-4 Mini Instruct 3.8B (Microsoft), servido por el
# mismo `ollama` que ya levanta compose.yml -- mismo mecanismo que los otros
# perfiles de Ollama. Ver compose.granite41.yml sobre por que este archivo se
# crea recien ahora para un modelo probado desde la sesion 8.
#
# Descartado como Sintetizador de texto libre en la sesion 8 (hallazgo 8):
# mismo defecto de "pegado de texto crudo" que granite4.1:3b. Este perfil
# existe para volver a probarlo con KB_LLM_SINTESIS_ESTRUCTURADA_HABILITADA=true
# (sesion 24/25).
#
# Uso, junto con el perfil GPU real:
#   docker compose -f compose.yml -f compose.gpu.yml -f compose.phi4mini.yml up -d
#
# El modelo NO se baja solo: hace falta `make pull-phi4mini` (o
# `docker compose exec ollama ollama pull phi4-mini:3.8b`) antes de levantar
# `api`, una sola vez.

services:
  api:
    environment:
      SPRING_AI_OPENAI_BASE_URL: http://ollama:11434/v1
      KB_LLM_MODELO: phi4-mini:3.8b
      KB_LLM_TIMEOUT: ${KB_LLM_TIMEOUT:-450s}
      KB_UMBRAL_RELEVANCIA_TECHO_CONFIANZA: ${KB_UMBRAL_RELEVANCIA_TECHO_CONFIANZA:-8.0}
      KB_EXPANDIR_VECINOS: ${KB_EXPANDIR_VECINOS:-false}
      KB_MAX_FRAGMENTOS_CONTEXTO: ${KB_MAX_FRAGMENTOS_CONTEXTO:-6}
      KB_RECUPERACION_TOP_RERANK: ${KB_RECUPERACION_TOP_RERANK:-6}
      KB_RECUPERACION_TOPE_POR_DOCUMENTO: ${KB_RECUPERACION_TOPE_POR_DOCUMENTO:-20}
      KB_LLM_SINTESIS_ESTRUCTURADA_HABILITADA: ${KB_LLM_SINTESIS_ESTRUCTURADA_HABILITADA:-false}
